name: Framework compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytorch-lightning:
    name: PyTorch 2.14 / Lightning 2.6 / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            dependencies/required.txt
            dependencies/pytorch.txt
            pyproject.toml
            setup.py
      - name: Install CPU framework and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r dependencies/required.txt -r dependencies/pytorch.txt pytest pytest-cov onnx hyperopt
          python -m pip install --no-deps -e .
      - name: Run SDK and framework regressions
        shell: bash
        run: |
          python -m pytest -o addopts= -q --tb=short \
            test/ut/sdk/mutable \
            test/ut/sdk/test_serializer.py \
            test/ut/sdk/test_version.py \
            test/ut/sdk/test_packaging.py \
            test/ut/sdk/test_torch_utils.py \
            test/ut/sdk/test_gp_tuner.py \
            test/ut/sdk/test_hyperopt_tuner.py \
            test/ut/experiment/test_config_base.py \
            test/ut/experiment/test_exp_config.py \
            test/ut/experiment/test_search_space.py \
            test/ut/nas/test_evaluator.py \
            test/ut/nas/test_utils.py \
            test/ut/nas/nn \
            test/ut/nas/profiler \
            test/algo/compression/base \
            test/algo/compression/utils/test_constructor_helper.py \
            test/algo/compression/utils/test_lightning_evaluator.py \
            test/algo/compression/utils/test_scaling.py \
            test/algo/compression/pruning/test_channel_dependency.py \
            test/algo/compression/pruning/test_speedup_state.py \
            test/algo/nas/oneshot/test_utils.py \
            test/algo/nas/oneshot/test_supermodules.py \
            test/algo/nas/oneshot/test_lightning_compatibility.py \
            --deselect=test/ut/sdk/test_serializer.py::test_dataset \
            --deselect=test/ut/sdk/test_serializer.py::test_multiprocessing_dataloader

  manager-webui:
    name: Manager and Web UI / Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: dependencies/required.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            ts/nni_manager/package-lock.json
            ts/webui/package-lock.json
      - name: Install Python SDK
        run: python -m pip install -e .
      - name: Build and exercise the manager
        working-directory: ts/nni_manager
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test -- --reporter dot
      - name: Build and check the Web UI
        working-directory: ts/webui
        run: |
          npm ci --no-audit --no-fund
          npm run sanity-check
          npm run build
